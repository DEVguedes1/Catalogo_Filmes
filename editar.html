<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CineLog - Editar filmes</title>

   <link rel="stylesheet" href="styles.css">
</head>

<body>

   <header class="topbar">
      <button class="menu-button" id="menu-button">☰</button>
      
      <a href="index.html" class="logo">CineLog</a>

   </header>

   <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">
         <span>CineLog</span>
      </div>

      <nav>

         <a href="index.html" class="nav-link">
            <img src="images/icons8-home-48.png" alt="Home" class="nav-icon" />
            <span>Home</span>
         </a>

         <a href="cadastro.html" class="nav-link">
            <img src="images/icons8-check-all-48.png" alt="Cadastrar" class="nav-icon" />
            <span>Cadastrar</span>
         </a>

         <a href="editar.html" class="nav-link active">
            <img src="images/icons8-edit-pencil-48 (1).png" alt="Editar" class="nav-icon" />
            <span>Editar</span>
         </a>

      </nav>
      
   </aside>

   <main class="main-content">

      <section class="page-header">

         <div>
            <h1>Editar Filme</h1>
            <p>Altere as informações do filme selecionado</p>
         </div>

      </section>

      <section class="registration-form">
         <div class="form-group">
            <label for="filme-select">Selecione o filme</label>

            <select id="filme-select">
               <option value="">Escolha um filme</option>
            </select>
         </div>
         <form id="edit-form">

            <div class="form-group">

               <label for="titulo">Título</label>
               <input 
                  type="text"
                  id="titulo"
                  placeholder="Título do filme"
                  required
               >
            </div>

            <div class="form-group">

               <label for="genero">Gênero</label>
               <input 
                  type="text"
                  id="genero"
                  placeholder="Gênero do filme"
                  required
               >
            </div>

            <div class="form-group">

               <label for="estudio">Estudio</label>
               <input  
                  type="text"
                  id="estudio"
                  placeholder="Estudio do filme"
                  required
               >
            </div>

            <div class="form-group">
               <label for="ano">Ano de Lançamento</label>
               <input 
                  type="number"
                  id="ano"
                  placeholder="Ano de lançamento"
                  required
               >
            </div>

            <div class="form-group">
               <label for="duracao">Duração (HH:MM)</label>
               <input 
                  type="text"
                  id="duracao"
                  placeholder="Ex: 2:15"
                  required
               >
            </div>

            <div class="form-group">
               <label for="nota">Nota</label>
               <input 
                  type="number"
                  id="nota"
                  placeholder="Nota do filme"
                  step="0.1"
                  required
               >
            </div>

            <button type="submit" class="btn-primary">
               Salvar Alterações
            </button>
         </form>

      </section>

   </main>

   <script src="Filme.js"></script>
   <script src="GerenciadorDeFilmes.js"></script>
   <script src="editar.js"></script>
   <script>
      const menuButton = document.getElementById("menu-button");
      const sidebar = document.getElementById("sidebar")

      menuButton.addEventListener ("click", () => {
         sidebar.classList.toggle("active");

      });
   </script>
</body>
</html>
