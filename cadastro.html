<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CineLog - Cadastrar Filme</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="topbar">
      <button class="menu-button" id="menu-button">☰</button>

      <a href="index.html" class="logo"> CineLog </a>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>CineLog</span>
      </div>

      <nav>
        <a href="index.html" class="nav-link">
          🏠
          <span>Home</span>
        </a>

        <a href="cadastro.html" class="nav-link active">
          ➕
          <span>Cadastrar</span>
        </a>

        <a href="editar.html" class="nav-link">
          ✏️
          <span>Editar</span>
        </a>

        <div class="separator"></div>

        <a href="#" class="nav-link">
          ⭐
          <span>Favoritos</span>
        </a>

        <a href="#" class="nav-link">
          🎬
          <span>Filmes</span>
        </a>

        <a href="#" class="nav-link">
          ℹ️
          <span>Sobre</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <section class="page-header">
        <div>
          <h1>Cadastrar Filme</h1>

          <p>Adicione um novo filme ao seu catálogo.</p>
        </div>
      </section>

      <section class="registration-form">
        <form id="movie-form">
          <div class="form-group">
            <label for="titulo"> Título </label>

            <input
              type="text"
              id="titulo"
              placeholder="Ex: Interestelar"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="genero"> Gênero </label>

              <input
                type="text"
                id="genero"
                placeholder="Ex: Ficção Científica"
                required
              />
            </div>

            <div class="form-group">
              <label for="estudio"> Estúdio </label>

              <input
                type="text"
                id="estudio"
                placeholder="Ex: Warner Bros."
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ano"> Ano de lançamento </label>

              <input
                type="number"
                id="ano"
                min="1888"
                max="2030"
                placeholder="Ex: 2014"
                required
              />
            </div>

            <div class="form-group">
              <label for="duracao"> Duração </label>

              <input
                type="number"
                id="duracao"
                min="1"
                placeholder="Ex: 169"
                required
              />
            </div>

            <div class="form-group">
              <label for="nota"> Nota </label>

              <input
                type="number"
                id="nota"
                min="0"
                max="10"
                step="0.1"
                placeholder="Ex: 8.7"
                required
              />
            </div>
          </div>

          <div class="form-actions">
            <a href="index.html" class="btn-secondary"> Cancelar </a>

            <button type="submit" class="btn-primary" id="btn-save">
              Salvar Filme
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="Filme.js"></script>
    <script src="GerenciadorDeFilmes.js"></script>
    <script src="app.js"></script>

    <script>
      const menuButton = document.getElementById("menu-button");
      const sidebar = document.getElementById("sidebar");

      menuButton.addEventListener("click", () => {
        sidebar.classList.toggle("active");
      });
    </script>
  </body>
</html>
