<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CineLog - Home</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="topbar">
      <button class="menu-button" id="menu-button">☰</button>

      <a href="index.html" class="logo"> CineLog </a>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>CineLog</span>
      </div>

      <nav>
        <a href="index.html" class="nav-link">
          <img src="images/icons8-home-48.png" alt="Home" class="nav-icon" />
          <span>Home</span>
        </a>

        <a href="cadastro.html" class="nav-link">
          <img src="images/icons8-check-all-48.png" alt="Cadastrar" class="nav-icon" />
          <span>Cadastrar</span>
        </a>

        <a href="editar.html" class="nav-link">
          <img src="images/icons8-edit-pencil-48 (1).png" alt="Editar" class="nav-icon" />
          <span>Editar</span>
        </a>

        <div class="separator"></div>

        <a href="#" class="nav-link">
          <img src="images/icons8-info-48.png" alt="Sobre" class="nav-icon" />
          <span>Sobre</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <section class="home-header">
        <div>
          <h1>Meus Filmes</h1>

          <p>Seu catálogo pessoal de cinema.</p>
        </div>

        <a href="cadastro.html" class="btn-primary"> + Cadastrar Filme </a>
      </section>

      <section id="movie-list" class="movie-grid"></section>
    </main>

    <script>
      const menuButton = document.getElementById("menu-button");
      const sidebar = document.getElementById("sidebar");

      menuButton.addEventListener("click", () => {
        sidebar.classList.toggle("active");
      });
    </script>

    <!-- Arquivos necessários para o READ -->
    <script src="Filme.js"></script>
    <script src="GerenciadorDeFilmes.js"></script>
    <script src="read.js"></script>
  </body>
</html>
