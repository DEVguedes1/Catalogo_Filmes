<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLog - Catálogo de Filmes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CineLog</h1>
            <p>Seu catálogo pessoal de cinema</p>
        </header>

        <main>
            <section class="registration-form">
                <h2>Cadastrar Novo Filme</h2>
                <form id="movie-form">
                    <div class="form-group">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" required placeholder="Ex: Inception">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="genero">Gênero</label>
                            <input type="text" id="genero" required placeholder="Ex: Ficção Científica">
                        </div>
                        <div class="form-group">
                            <label for="estudio">Estúdio</label>
                            <input type="text" id="estudio" required placeholder="Ex: Warner Bros.">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="ano">Ano</label>
                            <input type="number" id="ano" required min="1888" max="2030">
                        </div>
                        <div class="form-group">
                            <label for="duracao">Duração (min)</label>
                            <input type="number" id="duracao" required min="1">
                        </div>
                        <div class="form-group">
                            <label for="nota">Nota (0-10)</label>
                            <input type="number" id="nota" required min="0" max="10" step="0.1">
                        </div>
                    </div>

                    <button type="submit" id="btn-save">Salvar Filme</button>
                </form>
            </section>

            <section class="movie-list-section">
                <h2>Meus Filmes</h2>
                <div id="movie-list" class="movie-grid">
                    <!-- Filmes serão injetados aqui -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="Filme.js"></script>
    <script src="GerenciadorDeFilmes.js"></script>
    <script src="app.js"></script>
</body>
</html>
