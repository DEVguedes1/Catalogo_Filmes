<html lang="pt-br">

        <a href="index.html" class="logo"> CineLog </a>
        </header>
    
        <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>CineLog</span>
        </div>
    
        <nav>
            <a href="index.html" class="nav-link">
            🏠
            <span>Home</span>
            </a>
    
            <a href="cadastro.html" class="nav-link">
            ➕
            <span>Cadastrar</span>
            </a>
    
            <a href="#" class="nav-link">
            ✏️

            <a href="deletar.html" class="nav-link">
            ❌

            <a href="#" class="nav-link">

        </nav>

        <main class="main-content">
        <section class="page-header">
            <div>
                <h1>Deletar Filme</h1>
                <p>Remova um filme do seu catálogo.</p>
            </div>
        </section>

        <section class="deletion-form">
            <form id="movie-form">
                <label for="movie-title">Título do Filme:</label>
                <input type="text" id="titulo" name="movie-title" required />
    
                <button type="submit" class="btn-primary">Deletar Filme</button>
            </form>
            <div id="mensagemExclusao" class="mensagem-exclusao">
                <h2>Filme excluído!</h2>
                <p id="textoMensagem"></p>
                <button id="fecharMensagem">OK</button>
                
            </div>
        </section>
    </main>
    
    <script src="Filme.js"></script>
    <script src="GerenciadorDeFilmes.js"></script>
    <script src="deletar.js"></script>

    <script>
      const menuButton = document.getElementById("menu-button");
      const sidebar = document.getElementById("sidebar");

      menuButton.addEventListener("click", () => {
        sidebar.classList.toggle("active");
      });
    </script>
    </body>
